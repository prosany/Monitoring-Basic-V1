global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'monitoring-system'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 192.168.0.43:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['192.168.0.43:9090']